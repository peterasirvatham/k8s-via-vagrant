name: AIOps Assistant CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # --------------------------------------------------------------------------
  # 1. LINT JOB
  # Recommended: Runs on GitHub cloud (ubuntu-latest) for a clean, disposable
  # environment with pre-installed Python.
  # --------------------------------------------------------------------------
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linter
        run: pip install flake8

      - name: Run flake8
        run: flake8 app/ --max-line-length=120 --statistics

  # --------------------------------------------------------------------------
  # 2. TEST JOB
  # Recommended: Runs on GitHub cloud (ubuntu-latest) to guarantee tests run
  # isolated from leftover files or packages on your local VM.
  # --------------------------------------------------------------------------
  test:
    name: Run Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit and integration tests
        run: pytest tests/ -v --tb=short

  # --------------------------------------------------------------------------
  # 3. BUILD JOB
  # Recommended: Runs on GitHub cloud (ubuntu-latest) to save your local VM's
  # CPU & RAM and use GitHub's high-speed cloud bandwidth to push to Docker Hub.
  # --------------------------------------------------------------------------
  build:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/aiops-assistant:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/aiops-assistant:latest

  # --------------------------------------------------------------------------
  # 4. DEPLOY JOB
  # Recommended: Runs on [self-hosted, k8s] (your master VM).
  # This is the ONLY job that requires local network access to deploy directly
  # to your private Kubernetes cluster (192.168.56.24:6443) without exposing ports.
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to Kubernetes
    needs: build
    runs-on: [self-hosted, k8s]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Note: On a self-hosted runner running on the master node, kubectl and cluster
      # credentials (~/.kube/config) are already present. The 'setup-kubectl' and 
      # 'KUBE_CONFIG' secret injection steps below are only required if running on ubuntu-latest:
      # - name: Set up kubectl
      #   uses: azure/setup-kubectl@v3
      # - name: Configure kubeconfig
      #   run: |
      #     mkdir -p $HOME/.kube
      #     echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Update deployment image
        run: |
          kubectl set image deployment/aiops-assistant-deployment \
            assistant=${{ secrets.DOCKER_USERNAME }}/aiops-assistant:${{ github.sha }}

      - name: Wait for rollout to complete
        run: kubectl rollout status deployment/aiops-assistant-deployment --timeout=120s
