apiVersion: v1
kind: Service
metadata:
  name: aiops-assistant-service
  labels:
    app: aiops-assistant
spec:
  # NodePort exposes port 30501 across all Kubernetes worker node IPs
  # This enables external access and load-testing (e.g. hey -n 2000 http://<node-ip>:30501/)
  type: NodePort
  selector:
    app: aiops-assistant
  ports:
  - name: http
    port: 8501         # Internal cluster port
    targetPort: 8501   # Container port exposed by Streamlit app
    nodePort: 30501    # External port on cluster nodes (used for HPA load testing)
