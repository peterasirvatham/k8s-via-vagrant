apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiops-assistant-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  # Ingress provides HTTP routing using hostnames (e.g., http://aiops.local)
  # instead of raw NodePort IPs, routing requests to aiops-assistant-service:8501
  rules:
  - host: aiops.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aiops-assistant-service
            port:
              number: 8501
